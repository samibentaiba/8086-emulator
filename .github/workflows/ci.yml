name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: circuits-side/package-lock.json
      - name: Install circuit dependencies
        run: npm ci
        working-directory: circuits-side
      - name: Build and test circuits
        run: npm test
        working-directory: circuits-side
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . -r requirements.txt
      - name: Run unit tests
        run: python3 -m unittest discover tests
      - name: Build circuits
        run: python3 build_circuits.py
      - name: Lint schematics
        run: |
          python3 tools/lint_schematics.py --all --strict
