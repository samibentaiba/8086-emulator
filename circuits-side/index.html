<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#090d16" />
    <title>8086 Circuit Workbench</title>
    <meta name="description" content="Explore the Intel 8086 processor and system board, from architecture to individual logic gates." />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="appbar">
      <div class="brand">
        <svg viewBox="0 0 36 36" aria-hidden="true">
          <rect width="36" height="36" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
          <g fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 13h7l3-5h9M7 18h11l4-5h7M7 23h8l4 5h8" />
            <circle cx="7" cy="13" r="1.5" fill="#10b981" />
            <circle cx="29" cy="13" r="1.5" fill="#10b981" />
            <circle cx="27" cy="28" r="1.5" fill="#10b981" />
          </g>
        </svg>
        <div class="brand-text">
          <span class="chip-title">INTEL 8086</span>
          <span class="chip-sub">Circuit Workbench</span>
        </div>
      </div>

      <div class="nav-cluster">
        <label for="find" class="jump-label">Component:</label>
        <select id="find" aria-label="Select and jump to component">
          <option value="" disabled selected>Jump to Circuit Block...</option>
        </select>
      </div>

      <div class="zoom-cluster">
        <button id="minus" class="cad-btn" aria-label="Zoom out" title="Zoom out (−)">−</button>
        <output id="zoom">100%</output>
        <button id="plus" class="cad-btn" aria-label="Zoom in" title="Zoom in (+)">+</button>
        <button id="fit" class="cad-btn-text" title="Fit 8086 CPU Die">Fit CPU</button>
        <button id="fitBoard" class="cad-btn-text" title="Fit Full Microcomputer System Board">Fit Board</button>
      </div>

      <div class="crumb">
        <button id="home">System</button><span id="crumbpart"> / Intel 8086</span>
        <span class="level-badge" id="level">Architecture</span>
      </div>
    </header>

    <main id="workbench">
      <div id="canvas" tabindex="0" role="group" aria-label="Intel 8086 pure circuit schematic canvas. Scroll to zoom, drag to pan.">
        <svg id="map" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Intel 8086 full CPU and system board circuit schematic">
          <defs>
            <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
              <circle cx="1" cy="1" r="0.75" fill="#334155" />
            </pattern>
          </defs>
          <g id="world"></g>
        </svg>
      </div>

    </main>

    <footer class="boardlegend">
      <div class="legend-items">
        <span><b class="sw" style="background:#0d9488"></b>Data Bus [15:0]</span>
        <span><b class="sw" style="background:#d97706"></b>Address Bus [19:0]</span>
        <span><b class="sw" style="background:#7c3aed"></b>Microcode &amp; Control</span>
        <span><b class="sw" style="background:#16a34a"></b>System Clock 5 MHz</span>
        <span><b class="sw" style="background:#b91c1c"></b>VCC (+5V)</span>
        <span><b class="sw" style="background:#334155"></b>GND (0V)</span>
      </div>
      <div class="legend-tips">
        <span>Mouse Wheel: Zoom · Drag: Pan · Click: Focus · Double-Click: Deep Zoom | Keys: + / − Zoom · 0 Reset · Arrows: Pan</span>
      </div>
    </footer>

    <noscript>Enable JavaScript to explore the 8086 circuit workbench.</noscript>

    <script src="model.js"></script>
    <script src="diagram.js"></script>
    <script src="render-engine.js"></script>
    <script src="architecture.js"></script>
    <script src="app.js"></script>
  </body>
</html>
