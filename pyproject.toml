[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "emu8086"
version = "5.2.0"
description = "8086 Emulator with TUI debugger, virtual peripherals and EMU8086-compatible BIOS/DOS interrupts"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["8086", "emulator", "assembly", "debugger", "TUI"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Emulators",
    "Topic :: Software Development :: Debuggers",
]
dependencies = []

[project.optional-dependencies]
gui = ["PyQt5>=5.15"]
windows = ["windows-curses>=2.3"]

[project.scripts]
emu8086      = "main:main"
emu8086-tui  = "tui:main"
emu8086-gui  = "mainUI:main"

[project.gui-scripts]
emu8086-gui-windowed = "mainUI:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["emulator*", "ui*"]

[tool.setuptools.package-data]
"*" = ["*.asm"]
